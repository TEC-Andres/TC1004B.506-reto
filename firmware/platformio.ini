[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Stable version of the ESP8266 core for Arduino
build_flags =
    -std=gnu++17

lib_extra_dirs = lib
lib_deps =
    miguelbalboa/MFRC522@^1.4.11

[env:nodemcuv2]
build_src_filter =
    +<*>
    -<rfid_test.cpp>

[env:nodemcuv2_test]
build_src_filter =
    +<*>
    -<hardware.cpp>