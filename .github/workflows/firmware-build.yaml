name: Firmware Build

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yaml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yaml"

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: firmware
          file: firmware/Dockerfile
          load: true
          tags: reto-firmware:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build firmware
        run: |
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -v "$HOME/.platformio:/root/.platformio" \
            -w /project \
            reto-firmware:latest \
            pio run -e nodemcuv2
